# Full local stack: PostgreSQL + Redis + API + RQ worker + Streamlit UI
#   docker compose up --build
#   UI  http://localhost:8501     API docs  http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: packetpilot
      POSTGRES_PASSWORD: packetpilot
      POSTGRES_DB: packetpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetpilot"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql://packetpilot:packetpilot@db:5432/packetpilot
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: python -m packetpilot.worker
    environment: *env
    depends_on: [api]
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      PACKETPILOT_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
