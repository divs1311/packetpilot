[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetpilot"
version = "0.1.0"
description = "Evidence-backed document intelligence and submission workflow for independent commercial insurance brokerages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
queue = ["redis>=5", "rq>=1.16"]
ui = ["streamlit>=1.33", "pandas>=2.0"]
llm = ["openai>=1.40", "google-genai>=1.0"]
bench = ["reportlab>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
packetpilot = "packetpilot.cli:main"

[tool.setuptools.packages.find]
include = ["packetpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
