name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: pp, POSTGRES_PASSWORD: pp, POSTGRES_DB: packetpilot}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Unit + integration tests (SQLite)
        run: pytest
      - name: Service/API tests (PostgreSQL)
        run: pytest tests/test_service_api.py
        env: {TEST_DATABASE_URL: "postgresql://pp:pp@localhost:5432/packetpilot"}
      - name: Benchmark regression gate
        run: python scripts/check_benchmark.py
